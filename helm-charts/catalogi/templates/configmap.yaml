{{- $legacyUiConfigImportEnabled := eq (include "catalogi.legacyUiConfigImportEnabled" .) "true" -}}
{{- if and .Values.customization.enabled (or $legacyUiConfigImportEnabled .Values.customization.translations) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalogi.fullname" . }}-customization
  labels:
    {{- include "catalogi.labels" . | nindent 4 }}
data:
  {{- if $legacyUiConfigImportEnabled }}
  ui-config.json: |
    {{- .Values.customization.uiConfig | nindent 4 }}
  {{- end }}
  {{- if .Values.customization.translations }}
  {{- range $lang, $content := .Values.customization.translations }}
  translations_{{ $lang }}.json: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
