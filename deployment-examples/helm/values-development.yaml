# Development configuration for Catalogi
# This example is optimized for local development and testing

# Single replica for development
web:
  replicaCount: 1
  image:
    tag: "latest"
    pullPolicy: Always

  # Lower resource requirements
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

api:
  replicaCount: 1
  image:
    tag: "latest"
    pullPolicy: Always
  env:
    # Required by the API at startup. Use your own OIDC provider.
    OIDC_ISSUER_URI: "https://auth.yourdomain.com/realms/catalogi"
    OIDC_CLIENT_ID: "catalogi"
    OIDC_CLIENT_SECRET: "change-this-in-production"
    OIDC_MANAGE_PROFILE_URL: "https://auth.yourdomain.com/realms/catalogi/account"
    # Must match the public browser URL of the instance.
    APP_URL: "http://catalogi.local"
    CATALOGI_INITIAL_ADMIN_EMAIL: "admin@example.com"

  # Lower resource requirements
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Local database with small storage
database:
  user: "catalogi_dev"
  db: "catalogi_dev"
  password: "dev_password"

postgresql:
  enabled: true
  auth:
    username: "catalogi_dev"
    database: "catalogi_dev"
    password: "dev_password"
  primary:
    persistence:
      enabled: true
      size: 1Gi

# Development ingress (no TLS)
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: catalogi.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          service:
            name: web
            port: 80
        - path: /api
          pathType: ImplementationSpecific
          service:
            name: api
            port: 3000
  tls: []

# More frequent updates for development
update:
  schedule: "*/30 * * * *" # Every 30 minutes
  image:
    tag: "latest"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Enable adminer for database inspection
adminer:
  enabled: true
  image:
    repository: adminer
    tag: "latest"

# Development customization: custom translations only.
# The UI configuration is edited from Administration → Interface configuration.
customization:
  enabled: false
  translations:
    en: |-
      {
        "home": {
          "title": "Development Environment"
        }
      }
