# Basic production-ready configuration for Catalogi
# This example shows minimal required changes for production

# Configure your domain
ingress:
  enabled: true
  className: "nginx" # Change to your ingress class
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # If using cert-manager
  hosts:
    - host: catalogi.yourdomain.com # CHANGE THIS
      paths:
        - path: /
          pathType: ImplementationSpecific
          service:
            name: web
            port: 80
        - path: /api
          pathType: ImplementationSpecific
          service:
            name: api
            port: 3000
  tls:
    - secretName: catalogi-tls
      hosts:
        - catalogi.yourdomain.com # CHANGE THIS

# Database configuration - CHANGE THESE PASSWORDS
database:
  user: "catalogi_user"
  db: "catalogi_db"
  password: "your-secure-password-here" # CHANGE THIS

postgresql:
  enabled: true
  auth:
    username: "catalogi_user"
    database: "catalogi_db"
    password: "your-secure-password-here" # CHANGE THIS
  primary:
    persistence:
      enabled: true
      size: 20Gi

# Basic resource limits
web:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

api:
  env:
    CATALOGI_INITIAL_ADMIN_EMAIL: "admin@example.com" # CHANGE THIS to the first administrator's OIDC email
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

# New installations use the embedded standard UI configuration. Customize it
# from the administration page after the initial administrator signs in.
customization:
  enabled: false
